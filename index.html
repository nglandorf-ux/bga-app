<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BGA Fuhrenzähler</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BGA Zähler">

    <link rel="apple-touch-icon" href="icon3.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon3.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; margin: 0; }
        h2 { text-align: center; margin-top: 5px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:active { background-color: #218838; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .info-text { font-size: 12px; color: #666; margin-top: -2px; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚜 BGA Zähler</h2>
        
        <!-- Das Formular schickt die Daten direkt unsichtbar an Google -->
        <form id="bgaForm" action="https://script.google.com/macros/s/AKfycbzzoVfsaYGFQqqFLriGMsdDpudz1XOkv0xLAxVTsS4fGc0Oaa7bjOkgo53HePABTfuf/exec" method="POST" target="hidden_iframe" onsubmit="fuhreAbgeschickt()">
            
            <input type="hidden" name="data" id="jsonData">

            <label>Fahrer:</label>
            <select id="fahrer" name="fahrer">
                <option>Nils</option>
                <option>Lars</option>
                <option>Lukian</option>
                <option>Sergej</option>
            </select>

            <label>Schlepper:</label>
            <select id="fahrzeug" name="fahrzeug">
                <option>Valtra T215</option>
                <option>Arion 650</option>
                <option>Leihschlepper 1</option>
                <option>Leihschlepper 2</option>
            </select>

            <label>Anhänger:</label>
            <select id="anhaenger" name="anhaenger">
                <option>Mulde</option>
                <option>Häckselwagen</option>
                <option>Güllefass</option>
                <option>Ohne Anhänger</option>
            </select>

            <label>Aktion:</label>
            <select id="aktion" name="aktion">
                <option>Ernte (Silomais)</option>
                <option>Ernte (Gras)</option>
                <option>Gärrest Ausbringung</option>
            </select>

            <label>Volumen (m³):</label>
            <input type="number" id="volumen" placeholder="z.B. 38" step="0.1" required>

            <label>Gewicht (Tonnen pro m³):</label>
            <input type="number" id="dichte" placeholder="z.B. 0.75" step="0.01" required>
            <span class="info-text">Silomais ca. 0.30-0.40 | Gras ca. 0.25-0.30 | Gärrest ca. 1.0</span>

            <button type="submit" id="btn">🚀 Fuhre eintragen!</button>
        </form>

        <div id="status"></div>
    </div>

    <!-- Unsichtbarer Rahmen, damit man nicht auf eine andere Seite weitergeleitet wird -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        function fuhreAbgeschickt() {
            let vol = parseFloat(document.getElementById("volumen").value) || 0;
            let dich = parseFloat(document.getElementById("dichte").value) || 0;
            let gesamt = (vol * dich).toFixed(2);

            let payload = {
                datum: new Date().toLocaleDateString('de-DE'),
                uhrzeit: new Date().toLocaleTimeString('de-DE'),
                fahrer: document.getElementById("fahrer").value,
                fahrzeug: document.getElementById("fahrzeug").value,
                anhaenger: document.getElementById("anhaenger").value,
                aktion: document.getElementById("aktion").value,
                volumen: vol,
                dichte: dich,
                gesamtgewicht: gesamt
            };

            // Packt alles sauber als JSON in ein einziges Formularfeld
            document.getElementById("jsonData").value = JSON.stringify(payload);

            // Zeigt sofort die Bestätigung an
            setTimeout(() => {
                document.getElementById("status").innerText = "✅ " + gesamt + "t erfolgreich eingetragen!";
                document.getElementById("volumen").value = "";
                setTimeout(() => { document.getElementById("status").innerText = ""; }, 4000);
            }, 500);
        }
    </script>
</body>
</html>
