<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BGA Fuhrenzähler</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BGA Zähler">

    <link rel="apple-touch-icon" href="icon3.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon3.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; margin: 0; }
        h2 { text-align: center; margin-top: 5px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:active { background-color: #218838; }
        .btn-stats { background-color: #007bff; margin-top: 10px; }
        .btn-stats:active { background-color: #0056b3; }
        
        /* Auto-Modus Styles */
        .btn-auto { background-color: #17a2b8; padding: 20px; font-size: 18px; margin-top: 20px; }
        .btn-auto:active { background-color: #138496; }
        .btn-auto.active { background-color: #dc3545; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        #gpsCockpit { background: #333; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; margin-top: 15px; display: none; }
        .gps-alert { color: #ffeb3b; font-weight: bold; margin-bottom: 10px; display: block; font-size: 16px;}
        
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .info-text { font-size: 12px; color: #666; margin-top: -2px; margin-bottom: 8px; display: block; }
        
        .ranking-box { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 8px; }
        .ranking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ranking-title { font-weight: bold; font-size: 18px; margin: 0; }
        .date-picker { width: 140px; padding: 8px; margin: 0; border-radius: 6px; border: 1px solid #aaa; font-size: 14px; }
        .ranking-list { list-style-type: none; padding: 0; margin: 0; }
        .ranking-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ccc; }
        .ranking-item:last-child { border-bottom: none; }
        .rank-1 { font-weight: bold; color: #d4af37; }
        
        .auto-filled { background-color: #e8f5e9; border-color: #4caf50; }
        input[readonly] { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; border-color: #ccc; }
        .custom-input { display: none; margin-top: 5px; background-color: #fff3cd; border-color: #ffeeba; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚜 BGA Zähler</h2>
        
        <form id="bgaForm" action="" method="POST" target="hidden_iframe" onsubmit="return handleManualSubmit();">
            <input type="hidden" name="data" id="jsonData">

            <label>Fahrer:</label>
            <select id="fahrer" name="fahrer" onchange="checkCustom('fahrer')">
                <option>Nils</option>
                <option>Lars</option>
                <option>Lukian</option>
                <option>Sergej</option>
                <option value="custom">✍️ Anderer Fahrer...</option>
            </select>
            <input type="text" id="custom_fahrer" class="custom-input" placeholder="Name des Fahrers eintragen...">

            <label>Schlepper:</label>
            <select id="fahrzeug" name="fahrzeug" onchange="checkCustom('fahrzeug')">
                <option>Valtra T215D</option>
                <option>Arion 650</option>
                <option>Leihschlepper 1</option>
                <option>Leihschlepper 2</option>
                <option value="custom">✍️ Anderer Schlepper...</option>
            </select>
            <input type="text" id="custom_fahrzeug" class="custom-input" placeholder="Z.B. Claas Axion...">

            <label>Anhänger:</label>
            <select id="anhaenger" name="anhaenger" onchange="updateVolumen()">
                <option value="Bitte wählen..." data-vol="">-- Bitte wählen --</option>
                <option value="Mulde (37.5 m³)" data-vol="37.5">Mulde (37.5 m³)</option>
                <option value="Häckselwagen (40 m³)" data-vol="40">Häckselwagen (40 m³)</option>
                <option value="Häckselwagen (45 m³)" data-vol="45">Häckselwagen (45 m³)</option>
                <option value="Häckselwagen (50 m³)" data-vol="50">Häckselwagen (50 m³)</option>
                <option value="Güllefass (18 m³)" data-vol="18">Güllefass (18 m³)</option>
                <option value="custom" data-vol="manuell">✍️ Anderer Anhänger...</option>
            </select>
            <input type="text" id="custom_anhaenger" class="custom-input" placeholder="Z.B. Tebbe Wagen...">

            <label>Aktion:</label>
            <select id="aktion" name="aktion" onchange="updateDichte()">
                <option value="Bitte wählen...">-- Bitte wählen --</option>
                <option value="Ernte (Silomais)">Ernte (Silomais)</option>
                <option value="Ernte (Gras)">Ernte (Gras)</option>
                <option value="Gärrest Ausbringung">Gärrest Ausbringung</option>
            </select>

            <label>Volumen (m³):</label>
            <input type="number" id="volumen" placeholder="Wird durch Anhänger bestimmt..." step="0.1" required>

            <label>Gewicht (Tonnen pro m³):</label>
            <input type="number" id="dichte" placeholder="Wird automatisch vorgeschlagen..." step="0.01" required>
            <span class="info-text">Schüttgewicht Wagen: Mais ~0.35 | Gras ~0.25 | Gärrest ~1.0</span>

            <!-- Manueller Button bleibt für den Notfall -->
            <button type="submit" id="btn">🚀 Manuell eintragen</button>
        </form>

        <!-- AUTO MODUS BEREICH -->
        <button type="button" id="btnAutoModus" class="btn-auto" onclick="toggleAutoModus()">📡 Auto-Modus STARTEN</button>
        
        <div id="gpsCockpit">
            <span class="gps-alert" id="autoStatus">Warte auf Start...</span>
            Distanz zur BGA: <span id="distBGA">-</span> m<br>
            Distanz zum Feld: <span id="distFeld">-</span> m<br>
            Ladestatus: <span id="ladeStatus" style="color: #ff9800;">Leer</span>
        </div>

        <div id="status"></div>

        <div class="ranking-box" id="rankingBox">
            <div class="ranking-header">
                <div class="ranking-title">🏆 Ranking</div>
                <input type="date" id="statistikDatum" class="date-picker" onchange="ladeStatistik()">
            </div>
            <ul class="ranking-list" id="rankingList">
                <li style="text-align:center;">Lade Daten...</li>
            </ul>
        </div>

        <button onclick="oeffneTabelle()" class="btn-stats">📊 Live-Tabelle öffnen</button>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzoVfsaYGFQqqFLriGMsdDpudz1XOkv0xLAxVTsS4fGc0Oaa7bjOkgo53HePABTfuf/exec";
        document.getElementById("bgaForm").action = APPS_SCRIPT_URL;

        window.onload = function() {
            let heute = new Date().toISOString().split('T')[0];
            document.getElementById("statistikDatum").value = heute;
            ladeStatistik();
        };

        // --- GPS AUTOMATIK LOGIK ---
        
        // Zonen definieren
        const BGA_LAT = 53.61923769058454;
        const BGA_LON = 8.92679385181036;
        const BGA_RADIUS = 35; // Meter

        const FELD_LAT = 53.628795290594375; // Große Wiese
        const FELD_LON = 8.931582688013064;
        const FELD_RADIUS = 225; // Meter

        let autoModusAktiv = false;
        let gpsWatchId = null;
        let wakeLock = null;
        let fahrzeugBeladen = false; // Speichert, ob wir auf dem Feld waren

        async function toggleAutoModus() {
            let btn = document.getElementById("btnAutoModus");
            let cockpit = document.getElementById("gpsCockpit");

            if (!autoModusAktiv) {
                // STARTEN
                if (document.getElementById("anhaenger").value === "Bitte wählen..." || document.getElementById("aktion").value === "Bitte wählen...") {
                    alert("Bitte wähle zuerst Fahrzeug, Anhänger und Aktion aus, bevor du den Auto-Modus startest!");
                    return;
                }

                autoModusAktiv = true;
                btn.classList.add("active");
                btn.innerHTML = "🛑 Auto-Modus STOPPEN";
                cockpit.style.display = "block";
                document.getElementById("autoStatus").innerText = "Suche GPS-Signal...";
                
                // Display anlassen (WakeLock)
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log('Wake Lock Error:', err);
                }

                // GPS Überwachung starten
                if (navigator.geolocation) {
                    gpsWatchId = navigator.geolocation.watchPosition(pruefeStandort, zeigeGpsFehler, {
                        enableHighAccuracy: true, maximumAge: 0
                    });
                } else {
                    alert("GPS wird nicht unterstützt.");
                }

            } else {
                // STOPPEN
                autoModusAktiv = false;
                btn.classList.remove("active");
                btn.innerHTML = "📡 Auto-Modus STARTEN";
                cockpit.style.display = "none";
                fahrzeugBeladen = false;
                document.getElementById("ladeStatus").innerText = "Leer";
                document.getElementById("ladeStatus").style.color = "#ff9800";
                
                if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
                if (wakeLock !== null) wakeLock.release().then(() => wakeLock = null);
            }
        }

        // Berechnet die Distanz zwischen zwei Koordinaten in Metern (Haversine Formel)
        function berechneDistanz(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Erdradius in Metern
            const phi1 = lat1 * Math.PI/180;
            const phi2 = lat2 * Math.PI/180;
            const deltaPhi = (lat2-lat1) * Math.PI/180;
            const deltaLambda = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function pruefeStandort(position) {
            if (!autoModusAktiv) return;

            let myLat = position.coords.latitude;
            let myLon = position.coords.longitude;

            let distBGA = berechneDistanz(myLat, myLon, BGA_LAT, BGA_LON);
            let distFeld = berechneDistanz(myLat, myLon, FELD_LAT, FELD_LON);

            document.getElementById("distBGA").innerText = distBGA;
            document.getElementById("distFeld").innerText = distFeld;

            // Logik-Schritt 1: Sind wir auf dem Feld?
            if (distFeld <= FELD_RADIUS) {
                fahrzeugBeladen = true;
                document.getElementById("ladeStatus").innerText = "BELADEN ✅";
                document.getElementById("ladeStatus").style.color = "#0f0";
                document.getElementById("autoStatus").innerText = "Auf dem Feld. Fahre zur BGA...";
            } 
            else if (!fahrzeugBeladen) {
                document.getElementById("autoStatus").innerText = "Warte auf Einfahrt ins Feld...";
            }

            // Logik-Schritt 2: Sind wir beladen an der BGA angekommen?
            if (distBGA <= BGA_RADIUS && fahrzeugBeladen) {
                document.getElementById("autoStatus").innerText = "BGA erreicht! Speichere Fuhre...";
                
                // Setze sofort zurück, um Mehrfacheinträge zu verhindern
                fahrzeugBeladen = false; 
                document.getElementById("ladeStatus").innerText = "Leer";
                document.getElementById("ladeStatus").style.color = "#ff9800";
                
                // FEUERN!
                fuhreAbgeschickt();
            }
        }

        function zeigeGpsFehler(error) {
            document.getElementById("autoStatus").innerText = "Fehler: Kein GPS Signal!";
        }
        // --- ENDE GPS AUTOMATIK ---


        function checkCustom(id) {
            let select = document.getElementById(id);
            let customInput = document.getElementById("custom_" + id);
            if (select.value === "custom") {
                customInput.style.display = "block";
                customInput.required = true;
            } else {
                customInput.style.display = "none";
                customInput.required = false;
            }
        }

        function updateVolumen() {
            let select = document.getElementById("anhaenger");
            let vol = select.options[select.selectedIndex].getAttribute("data-vol");
            let volInput = document.getElementById("volumen");
            let customInput = document.getElementById("custom_anhaenger");
            
            if (select.value === "custom") {
                customInput.style.display = "block";
                customInput.required = true;
            } else {
                customInput.style.display = "none";
                customInput.required = false;
            }
            
            if (vol === "manuell") {
                volInput.value = "";
                volInput.readOnly = false;
                volInput.classList.remove("auto-filled");
            } else if (vol) {
                volInput.value = vol;
                volInput.readOnly = true; 
                volInput.classList.remove("auto-filled");
            } else {
                volInput.value = "";
                volInput.readOnly = false;
                volInput.classList.remove("auto-filled");
            }
        }

        function updateDichte() {
            let aktion = document.getElementById("aktion").value;
            let dichteInput = document.getElementById("dichte");
            
            if (aktion === "Ernte (Silomais)") {
                dichteInput.value = 0.35;
                dichteInput.classList.add("auto-filled");
            } else if (aktion === "Ernte (Gras)") {
                dichteInput.value = 0.25;
                dichteInput.classList.add("auto-filled");
            } else if (aktion === "Gärrest Ausbringung") {
                dichteInput.value = 1.00;
                dichteInput.classList.add("auto-filled");
            } else {
                dichteInput.value = "";
                dichteInput.classList.remove("auto-filled");
            }
        }

        document.getElementById("dichte").addEventListener("input", function() { this.classList.remove("auto-filled"); });

        function ladeStatistik() {
            document.getElementById("rankingList").innerHTML = "<li style='text-align:center;'>🔄 Lade...</li>";
            let auswahl = document.getElementById("statistikDatum").value;
            let teile = auswahl.split("-");
            let deutschesDatum = `${teile[2]}.${teile[1]}.${teile[0]}`;
            
            let scriptId = "jsonpScript";
            let altesScript = document.getElementById(scriptId);
            if (altesScript) { altesScript.remove(); }
            
            let script = document.createElement('script');
            script.id = scriptId;
            script.src = APPS_SCRIPT_URL + "?datum=" + encodeURIComponent(deutschesDatum) + "&callback=zeigeStatistik";
            document.body.appendChild(script);
        }

        function zeigeStatistik(data) {
            let listHTML = "";
            if (data.length === 0) {
                 listHTML = "<li class='ranking-item' style='justify-content:center;'>Keine Fuhren an diesem Tag!</li>";
            } else {
                for (let i = 0; i < data.length; i++) {
                    let rang = i + 1;
                    let nameClass = (rang === 1) ? "rank-1" : "";
                    let icon = (rang === 1) ? "👑 " : rang + ". ";
                    listHTML += `<li class="ranking-item">
                                    <span class="${nameClass}">${icon}${data[i].name}</span>
                                    <span>${data[i].fuhren} Fuhren | ${data[i].tonnen} t</span>
                                 </li>`;
                }
            }
            document.getElementById("rankingList").innerHTML = listHTML;
        }

        function handleManualSubmit() {
            fuhreAbgeschickt();
            return false; // Verhindert das normale Neuladen der Seite durch das Formular
        }

        function fuhreAbgeschickt() {
            let finalFahrer = document.getElementById("fahrer").value;
            if (finalFahrer === "custom") finalFahrer = document.getElementById("custom_fahrer").value;
            
            let finalFahrzeug = document.getElementById("fahrzeug").value;
            if (finalFahrzeug === "custom") finalFahrzeug = document.getElementById("custom_fahrzeug").value;
            
            let finalAnhaenger = document.getElementById("anhaenger").value;
            if (finalAnhaenger === "custom") finalAnhaenger = document.getElementById("custom_anhaenger").value;

            let vol = parseFloat(document.getElementById("volumen").value) || 0;
            let dich = parseFloat(document.getElementById("dichte").value) || 0;
            let gesamt = (vol * dich).toFixed(2);

            let d = new Date();
            let day = String(d.getDate()).padStart(2, '0');
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let year = d.getFullYear();
            let datumString = `${day}.${month}.${year}`;

            let payload = {
                datum: datumString,
                uhrzeit: d.toLocaleTimeString('de-DE'),
                fahrer: finalFahrer,
                fahrzeug: finalFahrzeug,
                anhaenger: finalAnhaenger,
                aktion: document.getElementById("aktion").value, 
                volumen: vol,
                dichte: dich,
                gesamtgewicht: gesamt
            };

            document.getElementById("jsonData").value = JSON.stringify(payload);
            
            // Führt den Submit zum unsichtbaren iframe aus (doPost)
            document.getElementById("bgaForm").submit();

            setTimeout(() => {
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerText = "✅ " + gesamt + "t eingetragen!";
                
                setTimeout(() => { 
                    document.getElementById("status").innerText = ""; 
                    let heute = new Date().toISOString().split('T')[0];
                    document.getElementById("statistikDatum").value = heute;
                    ladeStatistik(); 
                }, 3000);
            }, 500);
        }

        function oeffneTabelle() {
            window.open("https://docs.google.com/spreadsheets/d/1j9JcRlXpBI05lp3dx9vHV0jCbaIzNPwLgeR4vfMieTM/edit?gid=0#gid=0", "_blank");
        }
    </script>
</body>
</html>
