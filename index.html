<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BGA Fuhrenzähler</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BGA Zähler">

    <link rel="apple-touch-icon" href="icon3.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon3.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; margin: 0; }
        h2 { text-align: center; margin-top: 5px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:active { background-color: #218838; }
        .btn-stats { background-color: #007bff; margin-top: 10px; }
        .btn-stats:active { background-color: #0056b3; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .info-text { font-size: 12px; color: #666; margin-top: -2px; margin-bottom: 8px; display: block; }
        
        /* Neues Design für das Ranking */
        .ranking-box { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 8px; }
        .ranking-title { font-weight: bold; text-align: center; margin-bottom: 10px; font-size: 18px; }
        .ranking-list { list-style-type: none; padding: 0; margin: 0; }
        .ranking-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ccc; }
        .ranking-item:last-child { border-bottom: none; }
        .rank-1 { font-weight: bold; color: #d4af37; /* Gold */ }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚜 BGA Zähler</h2>
        
        <form id="bgaForm" action="" method="POST" target="hidden_iframe" onsubmit="fuhreAbgeschickt()">
            <input type="hidden" name="data" id="jsonData">

            <label>Fahrer:</label>
            <select id="fahrer" name="fahrer">
                <option>Nils</option>
                <option>Lars</option>
                <option>Lukian</option>
                <option>Sergej</option>
            </select>

            <label>Schlepper:</label>
            <select id="fahrzeug" name="fahrzeug">
                <option>Valtra T215D</option>
                <option>Arion 650</option>
                <option>Leihschlepper 1</option>
                <option>Leihschlepper 2</option>
            </select>

            <label>Anhänger:</label>
            <select id="anhaenger" name="anhaenger">
                <option>Mulde</option>
                <option>Häckselwagen</option>
                <option>Güllefass</option>
                <option>Ohne Anhänger</option>
            </select>

            <label>Aktion:</label>
            <select id="aktion" name="aktion">
                <option>Ernte (Silomais)</option>
                <option>Ernte (Gras)</option>
                <option>Gärrest Ausbringung</option>
            </select>

            <label>Volumen (m³):</label>
            <input type="number" id="volumen" placeholder="z.B. 38" step="0.1" required>

            <label>Gewicht (Tonnen pro m³):</label>
            <input type="number" id="dichte" placeholder="z.B. 0.75" step="0.01" required>
            <span class="info-text">Silomais ca. 0.65-0.75 | Gras ca. 0.35-0.45 | Gärrest ca. 1.0</span>

            <button type="submit" id="btn">🚀 Fuhre eintragen!</button>
        </form>

        <div id="status"></div>

        <!-- Hier wird das Ranking angezeigt -->
        <div class="ranking-box" id="rankingBox" style="display: none;">
            <div class="ranking-title">🏆 Heutiges Ranking</div>
            <ul class="ranking-list" id="rankingList">
                <!-- Wird per JavaScript gefüllt -->
            </ul>
        </div>

        <button onclick="oeffneTabelle()" class="btn-stats">📊 Live-Tabelle öffnen</button>
        
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        // HIER DEINE APPS SCRIPT URL EINTRAGEN:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzoVfsaYGFQqqFLriGMsdDpudz1XOkv0xLAxVTsS4fGc0Oaa7bjOkgo53HePABTfuf/exec";
        
        document.getElementById("bgaForm").action = APPS_SCRIPT_URL;

        window.onload = ladeStatistik;

        function ladeStatistik() {
            document.getElementById("status").innerText = "🔄 Lade Ranking...";
            document.getElementById("status").style.color = "#333";
            document.getElementById("rankingBox").style.display = "none";
            
            let script = document.createElement('script');
            script.src = APPS_SCRIPT_URL + "?callback=zeigeStatistik";
            document.body.appendChild(script);
        }

        function zeigeStatistik(data) {
            document.getElementById("status").innerText = ""; // Lade-Text ausblenden
            
            let listHTML = "";
            
            if (data.length === 0) {
                 listHTML = "<li class='ranking-item'>Noch keine Fuhren heute! Hau rein!</li>";
            } else {
                for (let i = 0; i < data.length; i++) {
                    let rang = i + 1;
                    let nameClass = (rang === 1) ? "rank-1" : "";
                    let icon = (rang === 1) ? "👑 " : rang + ". ";
                    
                    listHTML += `<li class="ranking-item">
                                    <span class="${nameClass}">${icon}${data[i].name}</span>
                                    <span>${data[i].fuhren} Fuhren | ${data[i].tonnen} t</span>
                                 </li>`;
                }
            }
            
            document.getElementById("rankingList").innerHTML = listHTML;
            document.getElementById("rankingBox").style.display = "block";
        }

        function fuhreAbgeschickt() {
            let vol = parseFloat(document.getElementById("volumen").value) || 0;
            let dich = parseFloat(document.getElementById("dichte").value) || 0;
            let gesamt = (vol * dich).toFixed(2);

            let d = new Date();
            let day = String(d.getDate()).padStart(2, '0');
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let year = d.getFullYear();
            let datumString = `${day}.${month}.${year}`;

            let payload = {
                datum: datumString,
                uhrzeit: d.toLocaleTimeString('de-DE'),
                fahrer: document.getElementById("fahrer").value,
                fahrzeug: document.getElementById("fahrzeug").value,
                anhaenger: document.getElementById("anhaenger").value,
                aktion: document.getElementById("aktion").value, // Aktion kommt aus dem Dropdown
                volumen: vol,
                dichte: dich,
                gesamtgewicht: gesamt
            };

            document.getElementById("jsonData").value = JSON.stringify(payload);

            setTimeout(() => {
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerText = "✅ " + gesamt + "t eingetragen!";
                document.getElementById("volumen").value = "";
                
                setTimeout(() => { ladeStatistik(); }, 3000);
            }, 500);
        }

        function oeffneTabelle() {
            // HIER DEN DIREKTEN LINK ZU DEINER GOOGLE TABELLE EINTRAGEN:
            window.open("https://docs.google.com/spreadsheets/d/1j9JcRlXpBI05lp3dx9vHV0jCbaIzNPwLgeR4vfMieTM/edit?gid=0#gid=0", "_blank");
        }
    </script>
</body>
</html>
