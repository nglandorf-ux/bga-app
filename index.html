<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BGA Fuhrenzähler</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BGA Zähler">

    <link rel="apple-touch-icon" href="icon3.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon3.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; margin: 0; }
        h2 { text-align: center; margin-top: 5px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:active { background-color: #218838; }
        .btn-stats { background-color: #007bff; margin-top: 10px; }
        .btn-stats:active { background-color: #0056b3; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .info-text { font-size: 12px; color: #666; margin-top: -2px; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚜 BGA Zähler</h2>
        
        <label>Fahrer:</label>
        <select id="fahrer">
            <option>Nils</option>
            <option>Lars</option>
            <option>Lukian</option>
            <option>Sergej</option>
        </select>

        <label>Schlepper:</label>
        <select id="fahrzeug">
            <option>Valtra T215</option>
            <option>Arion 650</option>
            <option>Leihschlepper 1</option>
            <option>Leihschlepper 2</option>
        </select>

        <label>Anhänger:</label>
        <select id="anhaenger">
            <option>Mulde</option>
            <option>Häckselwagen</option>
            <option>Güllefass</option>
            <option>Ohne Anhänger</option>
        </select>

        <label>Aktion:</label>
        <select id="aktion">
            <option>Ernte (Silomais)</option>
            <option>Ernte (Gras)</option>
            <option>Gärrest Ausbringung</option>
        </select>

        <label>Volumen (m³):</label>
        <input type="number" id="volumen" placeholder="z.B. 38" step="0.1">

        <label>Gewicht (Tonnen pro m³):</label>
        <input type="number" id="dichte" placeholder="z.B. 0.75" step="0.01">
        <span class="info-text">Silomais ca. 0.65-0.75 | Gras ca. 0.35-0.45 | Gärrest ca. 1.0</span>

        <button onclick="fuhreSenden()" id="btn">🚀 Fuhre eintragen!</button>
        <button onclick="oeffneTabelle()" class="btn-stats">📊 Fuhren-Übersicht (Tabelle)</button>
        
        <div id="status"></div>
    </div>

    <!-- Unsichtbares iframe, damit der Browser den Request nicht wegen CORS blockiert -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="submitted=true;"></iframe>
    
    <!-- Ein verstecktes Formular, das direkt an Google sendet -->
    <form id="fuhrenForm" action="https://script.google.com/macros/s/AKfycbzzoVfsaYGFQqqFLriGMsdDpudz1XOkv0xLAxVTsS4fGc0Oaa7bjOkgo53HePABTfuf/exec" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="data" id="json_data">
    </form>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzoVfsaYGFQqqFLriGMsdDpudz1XOkv0xLAxVTsS4fGc0Oaa7bjOkgo53HePABTfuf/exec"; // Hier auch nochmal deine URL eintragen

        // Beim Laden des Dokuments die action des Forms setzen
        document.getElementById("fuhrenForm").action = APPS_SCRIPT_URL;

        function fuhreSenden() {
            let vol = parseFloat(document.getElementById("volumen").value) || 0;
            let dich = parseFloat(document.getElementById("dichte").value) || 0;
            
            if (vol <= 0 || dich <= 0) {
                alert("Bitte Volumen und Dichte eingeben!");
                return;
            }

            document.getElementById("btn").innerText = "Wird gesendet...";
            let gesamt = (vol * dich).toFixed(2);

            const payload = {
                datum: new Date().toLocaleDateString('de-DE'),
                uhrzeit: new Date().toLocaleTimeString('de-DE'),
                fahrer: document.getElementById("fahrer").value,
                fahrzeug: document.getElementById("fahrzeug").value,
                anhaenger: document.getElementById("anhaenger").value,
                aktion: document.getElementById("aktion").value,
                volumen: vol,
                dichte: dich,
                gesamtgewicht: gesamt
            };

            // Daten in das versteckte Formular packen und abschicken
            document.getElementById("json_data").value = JSON.stringify(payload);
            document.getElementById("fuhrenForm").submit();

            // Direktes Feedback für den Fahrer
            setTimeout(() => {
                document.getElementById("status").innerText = "✅ " + gesamt + "t erfolgreich eingetragen!";
                document.getElementById("btn").innerText = "🚀 Fuhre eintragen!";
                document.getElementById("volumen").value = ""; // Feld leeren für die nächste Fuhre
                setTimeout(() => { document.getElementById("status").innerText = ""; }, 4000);
            }, 800);
        }

        function oeffneTabelle() {
            // https://docs.google.com/spreadsheets/d/1j9JcRlXpBI05lp3dx9vHV0jCbaIzNPwLgeR4vfMieTM/edit?gid=0#gid=0:
            window.open("DEINE_GOOGLE_TABELLE_URL", "_blank");
        }
    </script>
</body>
</html>
