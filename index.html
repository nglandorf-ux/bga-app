<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BGA Fuhrenzähler (Supabase)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BGA Zähler">

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; color: #333; margin: 0; }
        h2 { text-align: center; margin-top: 5px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:active { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .info-text { font-size: 12px; color: #666; margin-top: -2px; margin-bottom: 8px; display: block; }
        .auto-filled { background-color: #e8f5e9; border-color: #4caf50; }
        input[readonly] { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; border-color: #ccc; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚜 BGA Zähler (Phase 2)</h2>
        
        <form id="bgaForm" onsubmit="return handleManualSubmit(event);">
            
            <label>Fahrer:</label>
            <select id="fahrer" required>
                <option value="">🔄 Lade Fahrer...</option>
            </select>

            <label>Schlepper:</label>
            <select id="fahrzeug" required>
                <option value="">🔄 Lade Schlepper...</option>
            </select>

            <!-- HIER NEU SORTIERT: Anhänger kommt direkt nach Schlepper -->
            <label>Anhänger:</label>
            <select id="anhaenger" onchange="updateVolumen()" required>
                <option value="" data-vol="">🔄 Lade Anhänger...</option>
            </select>

            <label>Feld / Schlag:</label>
            <select id="feld" required>
                <option value="">🔄 Lade Felder...</option>
            </select>

            <label>Aktion:</label>
            <select id="aktion" onchange="updateDichte()" required>
                <option value="">-- Bitte wählen --</option>
                <option value="Ernte (Silomais)">Ernte (Silomais)</option>
                <option value="Ernte (Gras)">Ernte (Gras)</option>
                <option value="Gärrest Ausbringung">Gärrest Ausbringung</option>
            </select>

            <label>Volumen (m³):</label>
            <input type="number" id="volumen" placeholder="Wird durch Anhänger bestimmt..." step="0.1" required>

            <label>Gewicht (Tonnen pro m³):</label>
            <input type="number" id="dichte" placeholder="Wird automatisch vorgeschlagen..." step="0.01" required>
            <span class="info-text">Schüttgewicht Wagen: Mais ~0.35 | Gras ~0.25 | Gärrest ~1.0</span>

            <button type="submit" id="btn">🚀 Fuhre speichern</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://muyienufbglqglojpidi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EsT5ljdQrfSbMuh8vYJM9w_vUl3X8wd";
        
        const headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        let currentFarmId = null;

        window.onload = async function() {
            document.getElementById("status").innerText = "Verbinde mit Datenbank...";
            document.getElementById("status").style.color = "orange";
            
            try {
                let resFarm = await fetch(SUPABASE_URL + "/rest/v1/farms?limit=1", { headers });
                let farms = await resFarm.json();
                if (farms.length > 0) currentFarmId = farms[0].id;

                let resProf = await fetch(SUPABASE_URL + "/rest/v1/profiles?select=id,first_name", { headers });
                let profiles = await resProf.json();
                let fahrerHtml = '<option value="">-- Bitte wählen --</option>';
                profiles.forEach(p => { fahrerHtml += `<option value="${p.id}">${p.first_name}</option>`; });
                document.getElementById("fahrer").innerHTML = fahrerHtml;

                let resEq = await fetch(SUPABASE_URL + "/rest/v1/equipment?select=id,name,type,capacity_m3", { headers });
                let equipment = await resEq.json();
                
                let traktorHtml = '<option value="">-- Bitte wählen --</option>';
                let trailerHtml = '<option value="" data-vol="">-- Bitte wählen --</option>';
                
                equipment.forEach(e => {
                    if (e.type === 'tractor') {
                        traktorHtml += `<option value="${e.id}">${e.name}</option>`;
                    } else if (e.type === 'trailer') {
                        trailerHtml += `<option value="${e.id}" data-vol="${e.capacity_m3 || ''}">${e.name} (${e.capacity_m3} m³)</option>`;
                    }
                });
                document.getElementById("fahrzeug").innerHTML = traktorHtml;
                document.getElementById("anhaenger").innerHTML = trailerHtml;

                let resFields = await fetch(SUPABASE_URL + "/rest/v1/fields?select=id,name", { headers });
                let fields = await resFields.json();
                let feldHtml = '<option value="">-- Bitte wählen --</option>';
                if(fields.length === 0) feldHtml += '<option value="" disabled>Noch keine Felder angelegt</option>';
                fields.forEach(f => { feldHtml += `<option value="${f.id}">${f.name}</option>`; });
                document.getElementById("feld").innerHTML = feldHtml;

                document.getElementById("status").innerText = "✅ Bereit!";
                setTimeout(() => document.getElementById("status").innerText = "", 2000);

            } catch (error) {
                console.error("Fehler beim Laden:", error);
                document.getElementById("status").innerText = "❌ Fehler beim Verbinden!";
                document.getElementById("status").style.color = "red";
            }
        };

        function updateVolumen() {
            let select = document.getElementById("anhaenger");
            let vol = select.options[select.selectedIndex].getAttribute("data-vol");
            let volInput = document.getElementById("volumen");
            
            if (vol && vol !== "null") {
                volInput.value = vol;
                volInput.readOnly = true; 
            } else {
                volInput.value = "";
                volInput.readOnly = false;
            }
        }

        function updateDichte() {
            let aktion = document.getElementById("aktion").value;
            let dichteInput = document.getElementById("dichte");
            
            if (aktion === "Ernte (Silomais)") { dichteInput.value = 0.35; dichteInput.classList.add("auto-filled"); } 
            else if (aktion === "Ernte (Gras)") { dichteInput.value = 0.25; dichteInput.classList.add("auto-filled"); } 
            else if (aktion === "Gärrest Ausbringung") { dichteInput.value = 1.00; dichteInput.classList.add("auto-filled"); } 
            else { dichteInput.value = ""; dichteInput.classList.remove("auto-filled"); }
        }

        async function handleManualSubmit(event) {
            event.preventDefault(); 
            
            let btn = document.getElementById("btn");
            btn.innerText = "⏳ Speichere...";
            btn.disabled = true;

            let payload = {
                farm_id: currentFarmId,
                driver_id: document.getElementById("fahrer").value,
                tractor_id: document.getElementById("fahrzeug").value,
                trailer_id: document.getElementById("anhaenger").value,
                field_id: document.getElementById("feld").value || null, 
                action_type: document.getElementById("aktion").value, 
                volume_m3: parseFloat(document.getElementById("volumen").value),
                density_t_m3: parseFloat(document.getElementById("dichte").value)
            };

            try {
                let response = await fetch(SUPABASE_URL + "/rest/v1/trips", {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById("status").style.color = "green";
                    document.getElementById("status").innerText = "✅ Fuhre sicher im Schrank!";
                    document.getElementById("bgaForm").reset(); 
                } else {
                    let err = await response.json();
                    document.getElementById("status").style.color = "red";
                    document.getElementById("status").innerText = "❌ Fehler: " + err.message;
                }
            } catch (error) {
                document.getElementById("status").style.color = "red";
                document.getElementById("status").innerText = "❌ Verbindungsfehler!";
            }

            btn.innerText = "🚀 Fuhre speichern";
            btn.disabled = false;
            
            setTimeout(() => document.getElementById("status").innerText = "", 4000);
        }
    </script>
</body>
</html>
