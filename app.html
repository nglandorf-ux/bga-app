<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- WICHTIG FÜR HANDYS: Verhindert ungewolltes Zoomen und passt es an den Screen an -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hof Glandorf - Mobile</title>
    
    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; color: #e0e0e0; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        /* Oben: Kopfzeile */
        .header { background: #1e1e1e; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-size: 20px; font-weight: bold; color: #4caf50; }
        
        /* Mitte: Der scrollbare Inhalt */
        .content { flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        
        /* Die verschiedenen Module (Tabs) */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* UI Elemente */
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        select { width: 100%; padding: 15px; font-size: 18px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; margin-bottom: 20px; outline: none; }
        
        /* Fuhren-Zähler Design */
        .counter-display { text-align: center; font-size: 70px; font-weight: bold; color: #ff9800; margin: 10px 0; }
        .counter-label { text-align: center; font-size: 16px; color: #aaa; margin-bottom: 20px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 20px; font-size: 24px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; color: white; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-plus { background-color: #388e3c; }
        .btn-minus { background-color: #d32f2f; }
        
        /* Unten: Die modulare Navigation (Tabs) */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #1e1e1e; border-top: 1px solid #333; 
            display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .nav-item { 
            text-align: center; color: #888; font-size: 12px; cursor: pointer; flex-grow: 1; padding: 10px 0;
        }
        .nav-item.active { color: #4caf50; }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        
        #status-msg { text-align: center; margin-top: 15px; font-size: 14px; height: 20px; }
    </style>
</head>
<body>

    <div class="header" id="appHeader">🚜 Lührsfelder Bioenergie</div>

    <div class="content">
        
        <!-- MODUL 1: GÄRRESTE & FUHREN -->
        <div id="tab-fuhren" class="tab-content active">
            <div class="box">
                <label style="color: #aaa; font-size: 14px; margin-bottom: 8px; display: block;">Aktuelles Feld auswählen:</label>
                <select id="fieldSelect" onchange="loadTodayTrips()">
                    <option value="">-- Feld wählen --</option>
                    <!-- Wird per JS geladen -->
                </select>

                <div class="counter-label">Fuhren Heute (Manuell)</div>
                <div class="counter-display" id="tripCount">0</div>
                
                <div class="btn-grid">
                    <button class="btn btn-minus" onclick="removeTrip()">- 1</button>
                    <button class="btn btn-plus" onclick="addTrip()">+ 1</button>
                </div>
                
                <div id="status-msg"></div>
            </div>
            
            <div class="box" style="background: #2a2a2a; border-left: 4px solid #ff9800;">
                <h4 style="margin: 0 0 10px 0; color: #ff9800;">GPS Auto-Tracking</h4>
                <p style="margin: 0; font-size: 14px; color: #aaa;">Status: Wird im nächsten Update aktiviert (5m Toleranzgrenze).</p>
            </div>
        </div>

        <!-- MODUL 2: RINDER (Platzhalter für später) -->
        <div id="tab-rinder" class="tab-content">
            <div class="box">
                <h3 style="margin-top: 0;">🐄 Rinder Bestand</h3>
                <p style="color: #aaa; font-size: 14px;">Hier kommt später die HIT-Datenbank Anbindung und die Bestandsverwaltung rein.</p>
                <button style="width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 8px; margin-top: 10px;">HIT Daten abrufen (Demo)</button>
            </div>
        </div>

    </div>

    <!-- NAVIGATION UNTEN -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('fuhren', this)">
            <span class="nav-icon">🚜</span>
            Gärreste
        </div>
        <div class="nav-item" onclick="switchTab('rinder', this)">
            <span class="nav-icon">🐄</span>
            Rinder
        </div>
        <div class="nav-item" onclick="switchTab('radar', this)">
            <span class="nav-icon">🌦️</span>
            Radar
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://muyienufbglqglojpidi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EsT5ljdQrfSbMuh8vYJM9w_vUl3X8wd";
        const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=representation" };

        let currentTrips = 0;

        // Navigation wechseln
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById('tab-' + tabId)?.classList.add('active');
            element.classList.add('active');
            
            if(tabId === 'rinder') document.getElementById('appHeader').innerText = "🐄 Rinder-Management";
            else if(tabId === 'fuhren') document.getElementById('appHeader').innerText = "🚜 Lührsfelder Bioenergie";
            else document.getElementById('appHeader').innerText = "Hof Glandorf";
        }

        // 1. Felder aus der Datenbank laden
        async function loadFields() {
            try {
                let res = await fetch(SUPABASE_URL + "/rest/v1/fields?select=id,name&order=name.asc", { headers });
                let fields = await res.json();
                
                let select = document.getElementById("fieldSelect");
                fields.forEach(f => {
                    let option = document.createElement("option");
                    option.value = f.id;
                    option.text = f.name;
                    select.appendChild(option);
                });
            } catch (error) { console.error("Fehler beim Laden der Felder", error); }
        }

        // 2. Fuhren für heute und dieses Feld zählen
        async function loadTodayTrips() {
            let fieldId = document.getElementById("fieldSelect").value;
            if(!fieldId) {
                document.getElementById("tripCount").innerText = "0";
                currentTrips = 0;
                return;
            }

            // Wir holen alle Fuhren von HEUTE (Geprüft wird, ob das Datum nach Mitternacht liegt)
            let today = new Date();
            today.setHours(0,0,0,0);
            let todayISO = today.toISOString();

            try {
                let res = await fetch(SUPABASE_URL + `/rest/v1/fuhren?field_id=eq.${fieldId}&zeitpunkt=gte.${todayISO}&select=id`, { headers });
                let trips = await res.json();
                
                currentTrips = trips.length;
                document.getElementById("tripCount").innerText = currentTrips;
            } catch (error) { console.error("Fehler beim Zählen", error); }
        }

        // 3. Fuhre HINZUFÜGEN (+1)
        async function addTrip() {
            let fieldId = document.getElementById("fieldSelect").value;
            let statusEl = document.getElementById("status-msg");
            
            if(!fieldId) {
                statusEl.innerText = "⚠️ Bitte erst ein Feld auswählen!";
                statusEl.style.color = "orange";
                setTimeout(() => statusEl.innerText = "", 3000);
                return;
            }

            // Knopf vibriert kurz auf dem Handy (Feedback)
            if (navigator.vibrate) navigator.vibrate(50);

            try {
                let payload = { field_id: fieldId, erfassungs_modus: 'manuell' };
                let res = await fetch(SUPABASE_URL + "/rest/v1/fuhren", {
                    method: "POST", headers: headers, body: JSON.stringify(payload)
                });

                if(res.ok) {
                    currentTrips++;
                    document.getElementById("tripCount").innerText = currentTrips;
                    statusEl.innerText = "✅ Fuhre gespeichert!";
                    statusEl.style.color = "#4caf50";
                }
            } catch (error) { statusEl.innerText = "❌ Fehler!"; statusEl.style.color = "red"; }
            setTimeout(() => statusEl.innerText = "", 2000);
        }

        // 4. Fuhre ABZIEHEN (-1) - Löscht den neuesten Eintrag von heute
        async function removeTrip() {
            let fieldId = document.getElementById("fieldSelect").value;
            if(!fieldId || currentTrips === 0) return;

            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); // Anderes Vibrationsmuster

            try {
                // Wir holen die ID der NEUESTEN Fuhre von diesem Feld
                let res = await fetch(SUPABASE_URL + `/rest/v1/fuhren?field_id=eq.${fieldId}&order=zeitpunkt.desc&limit=1`, { headers });
                let latestTrip = await res.json();

                if(latestTrip.length > 0) {
                    // Und löschen genau diese eine ID
                    let delRes = await fetch(SUPABASE_URL + `/rest/v1/fuhren?id=eq.${latestTrip[0].id}`, {
                        method: "DELETE", headers: headers
                    });

                    if(delRes.ok) {
                        currentTrips--;
                        document.getElementById("tripCount").innerText = currentTrips;
                    }
                }
            } catch (error) { console.error("Fehler beim Löschen", error); }
        }

        // Beim Start Felder laden
        window.onload = loadFields;
    </script>
</body>
</html>
