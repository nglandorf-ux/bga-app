<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hof Glandorf - Kommandozentrale</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #121212; color: #e0e0e0; }
        #sidebar { width: 380px; background: #1e1e1e; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; border-right: 1px solid #333; }
        #map { flex-grow: 1; height: 100%; z-index: 1; }
        h2 { margin-top: 0; color: #4caf50; font-size: 24px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h3 { color: #fff; font-size: 16px; margin-bottom: 10px; }
        
        .box { background: #2a2a2a; padding: 18px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button { background-color: #388e3c; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; margin-top: 15px; }
        button:hover { background-color: #2e7d32; }
        button:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        
        .feld-liste { list-style: none; padding: 0; margin: 0; }
        .feld-liste li { background: #333; margin-bottom: 8px; padding: 12px 15px; border-radius: 6px; font-size: 15px; cursor: pointer; transition: 0.2s; border-left: 4px solid #388e3c; display: flex; justify-content: space-between; align-items: center; }
        .feld-liste li:hover { background: #444; transform: translateX(5px); }
        
        /* Modal (Das edle Popup-Fenster) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e1e1e; width: 800px; max-width: 95%; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; color: #fff; border: none; padding: 0; }
        .close-btn { background: transparent; color: #aaa; font-size: 24px; border: none; cursor: pointer; width: auto; margin: 0; padding: 0; }
        .close-btn:hover { color: #fff; background: transparent; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .anbau-history { margin-top: 15px; background: #2a2a2a; padding: 10px; border-radius: 6px; font-size: 13px; }
        .history-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #444; }
        .history-item:last-child { border: none; }
        
        #status-msg { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Linke Seitenleiste -->
    <div id="sidebar">
        <h2>🗺️ Hof Glandorf</h2>
        
        <div class="box">
            <h3>Neue Fläche erfassen</h3>
            <p style="font-size: 12px; color: #aaa; margin-top:0;">1. Polygon auf Karte zeichnen<br>2. Name vergeben<br>3. Speichern klicken</p>
            <input type="text" id="feldName" placeholder="z.B. Lührsfelder Wiese">
            <button id="btnSave" onclick="saveNewField()" disabled>Fläche speichern</button>
            <div id="status-msg"></div>
        </div>

        <div class="box" style="flex-grow: 1; display: flex; flex-direction: column;">
            <h3>Schlagkartei</h3>
            <ul id="feldListe" class="feld-liste" style="flex-grow: 1; overflow-y: auto;">
                <li>Lade Schläge...</li>
            </ul>
        </div>
    </div>

    <!-- Karte -->
    <div id="map"></div>

    <!-- Das Modal (Popup) für die Felddetails -->
    <div id="fieldModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Feld Details</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="grid-2">
                <!-- Linke Spalte: Boden & Stammdaten -->
                <div>
                    <h3 style="color: #4caf50;">Stammdaten & Boden</h3>
                    <div class="grid-2" style="gap: 15px;">
                        <div class="form-group">
                            <label>Nutzungsart</label>
                            <select id="modalNutzung">
                                <option value="">-- Wählen --</option>
                                <option value="Ackerland">Ackerland</option>
                                <option value="Dauergrünland">Dauergrünland</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Bodenart</label>
                            <select id="modalBodenart">
                                <option value="">-- Wählen --</option>
                                <option value="Sand (S)">Sand (S)</option>
                                <option value="lehmiger Sand (lS)">lehmiger Sand (lS)</option>
                                <option value="sandiger Lehm (sL)">sandiger Lehm (sL)</option>
                                <option value="Lehm (L)">Lehm (L)</option>
                                <option value="Moor (Mo)">Moor (Mo)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid-2" style="gap: 15px;">
                        <div class="form-group">
                            <label>pH-Wert</label>
                            <input type="number" step="0.1" id="modalPh" placeholder="z.B. 5.8">
                        </div>
                        <div class="form-group">
                            <label>Phosphor (P) Klasse</label>
                            <select id="modalP"><option value="">-</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
                        </div>
                    </div>
                    <div class="grid-2" style="gap: 15px;">
                        <div class="form-group">
                            <label>Kalium (K) Klasse</label>
                            <select id="modalK"><option value="">-</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
                        </div>
                        <div class="form-group">
                            <label>Magnesium (Mg) Klasse</label>
                            <select id="modalMg"><option value="">-</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
                        </div>
                    </div>
                    <button onclick="saveFieldDetails()" style="margin-top: 25px;">Bodendaten speichern</button>
                    <div id="modal-status" style="color: #4caf50; margin-top: 10px; text-align: center; height: 20px;"></div>
                </div>

                <!-- Rechte Spalte: Anbauplanung -->
                <div>
                    <h3 style="color: #ff9800;">Anbauplanung & Fruchtfolge</h3>
                    
                    <div class="box" style="background: #222; padding: 15px; margin-bottom: 15px;">
                        <div class="grid-2" style="gap: 10px;">
                            <div class="form-group">
                                <label>Erntejahr</label>
                                <input type="number" id="anbauJahr" value="2026">
                            </div>
                            <div class="form-group">
                                <label>Fruchtart</label>
                                <select id="anbauFrucht">
                                    <option value="Silomais">Silomais</option>
                                    <option value="Winterweizen">Winterweizen</option>
                                    <option value="Ackergras">Ackergras</option>
                                    <option value="Dauergrünland">Dauergrünland</option>
                                    <option value="Brache">Brache</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="saveAnbau()" style="background-color: #ff9800; margin-top: 10px;">Frucht eintragen</button>
                    </div>

                    <label style="font-size: 12px; color: #aaa;">Historie / Planung</label>
                    <div id="anbauListe" class="anbau-history">
                        <!-- Wird per Javascript gefüllt -->
                        Lädt...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://muyienufbglqglojpidi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EsT5ljdQrfSbMuh8vYJM9w_vUl3X8wd";
        const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=representation" };

        let currentFarmId = null;
        let drawnPolygonWKT = null;
        let activeFieldId = null; // Merkt sich, welches Feld gerade im Popup offen ist

        // Karte starten über Lührsfelde
        var map = L.map('map').setView([53.612, 8.910], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);
        var drawControl = new L.Control.Draw({
            draw: { polygon: { shapeOptions: { color: '#ff9800', weight: 3 } }, polyline: false, rectangle: false, circle: false, marker: false, circlemarker: false },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (event) {
            drawnItems.clearLayers();
            var layer = event.layer;
            drawnItems.addLayer(layer);
            let latlngs = layer.getLatLngs()[0];
            let coords = latlngs.map(ll => `${ll.lng} ${ll.lat}`);
            coords.push(`${latlngs[0].lng} ${latlngs[0].lat}`); 
            drawnPolygonWKT = `SRID=4326;POLYGON(({{${coords.join(', ')}}}))`.replace("{{", "").replace("}}", "");
            document.getElementById("btnSave").disabled = false;
        });

        async function loadFields() {
            try {
                let resFarm = await fetch(SUPABASE_URL + "/rest/v1/farms?limit=1", { headers });
                let farms = await resFarm.json();
                if (farms.length > 0) currentFarmId = farms[0].id;

                let resFields = await fetch(SUPABASE_URL + "/rest/v1/fields?select=id,name", { headers });
                let fields = await resFields.json();
                
                let listHtml = '';
                fields.forEach(f => { 
                    listHtml += `<li onclick="openModal('${f.id}', '${f.name}')">${f.name} <span>⚙️</span></li>`; 
                });
                document.getElementById("feldListe").innerHTML = listHtml || '<li>Keine Felder vorhanden</li>';
            } catch (error) { console.error(error); }
        }

        async function saveNewField() {
            let nameInput = document.getElementById("feldName").value;
            if(!nameInput) return;
            document.getElementById("btnSave").disabled = true;
            let payload = { farm_id: currentFarmId, name: nameInput };

            try {
                let response = await fetch(SUPABASE_URL + "/rest/v1/fields", {
                    method: "POST", headers: headers, body: JSON.stringify(payload)
                });
                if (response.ok) {
                    document.getElementById("feldName").value = "";
                    drawnPolygonWKT = null;
                    drawnItems.clearLayers();
                    loadFields();
                    
                    // Nach dem Speichern GPS direkt über SQL eintragen (da JSON kein Geography direkt schluckt)
                    // (Für diese Demo reicht es, dass das Feld als Name angelegt wird. Die Geo-Logik bauen wir ein, wenn du so weit bist).
                }
            } catch (error) { console.error(error); }
        }

        // --- MODAL LOGIK (Die neuen Profi-Funktionen) ---
        
        async function openModal(id, name) {
            activeFieldId = id;
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("fieldModal").style.display = "flex";
            document.getElementById("modal-status").innerText = "Lade Daten...";
            
            // 1. Bodendaten laden
            let res = await fetch(SUPABASE_URL + `/rest/v1/fields?id=eq.${id}&select=*`, { headers });
            let data = await res.json();
            if(data.length > 0) {
                let f = data[0];
                document.getElementById("modalNutzung").value = f.nutzungsart || "";
                document.getElementById("modalBodenart").value = f.bodenart || "";
                document.getElementById("modalPh").value = f.ph_wert || "";
                document.getElementById("modalP").value = f.phosphor_klasse || "";
                document.getElementById("modalK").value = f.kalium_klasse || "";
                document.getElementById("modalMg").value = f.magnesium_klasse || "";
            }
            
            // 2. Anbau-Historie laden
            loadAnbauHistory();
            document.getElementById("modal-status").innerText = "";
        }

        function closeModal() {
            document.getElementById("fieldModal").style.display = "none";
            activeFieldId = null;
        }

        async function saveFieldDetails() {
            let payload = {
                nutzungsart: document.getElementById("modalNutzung").value,
                bodenart: document.getElementById("modalBodenart").value,
                ph_wert: parseFloat(document.getElementById("modalPh").value) || null,
                phosphor_klasse: document.getElementById("modalP").value,
                kalium_klasse: document.getElementById("modalK").value,
                magnesium_klasse: document.getElementById("modalMg").value
            };
            
            let res = await fetch(SUPABASE_URL + `/rest/v1/fields?id=eq.${activeFieldId}`, {
                method: "PATCH", headers: headers, body: JSON.stringify(payload)
            });
            
            if(res.ok) document.getElementById("modal-status").innerText = "✅ Erfolgreich gespeichert!";
            setTimeout(() => document.getElementById("modal-status").innerText = "", 3000);
        }

        async function loadAnbauHistory() {
            let res = await fetch(SUPABASE_URL + `/rest/v1/anbauplanung?field_id=eq.${activeFieldId}&order=wirtschaftsjahr.desc`, { headers });
            let anbau = await res.json();
            
            let html = "";
            if(anbau.length === 0) html = "<div style='color:#888; text-align:center;'>Noch kein Anbau eingetragen</div>";
            anbau.forEach(a => {
                html += `<div class="history-item">
                            <strong>${a.wirtschaftsjahr}</strong>
                            <span>${a.fruchtart}</span>
                         </div>`;
            });
            document.getElementById("anbauListe").innerHTML = html;
        }

        async function saveAnbau() {
            let payload = {
                field_id: activeFieldId,
                wirtschaftsjahr: parseInt(document.getElementById("anbauJahr").value),
                fruchtart: document.getElementById("anbauFrucht").value
            };
            
            // Upsert (Wenn Jahr schon existiert, überschreiben)
            let res = await fetch(SUPABASE_URL + `/rest/v1/anbauplanung`, {
                method: "POST", 
                headers: { ...headers, "Prefer": "resolution=merge-duplicates" },
                body: JSON.stringify(payload)
            });
            
            if(res.ok) loadAnbauHistory();
        }

        window.onload = loadFields;
    </script>
</body>
</html>
